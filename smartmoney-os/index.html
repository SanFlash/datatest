px}.legend b{margin-left:auto;color:#dce5f1}.dot{width:8px;height:8px;border-radius:3px;background:#5ca5f7}.purple{background:#9c83f3}.green{background:#46c99b}.gray{background:#65758a}table{width:100%;border-collapse:collapse;min-width:690px}th{text-align:left;color:#687990;font-size:9px;letter-spacing:1px;padding:0 8px 12px;border-bottom:1px solid #263246}td{padding:12px 8px;border-bottom:1px solid #1e2a3c;font-size:10px;color:#adbbce}.name{color:#e1e9f5;font-weight:700}.sub{font-size:9px;color:#7d8ca2;margin-top:4px}.right{text-align:right}.pos{color:#61d8a8;font-weight:700}.neg{color:#f2aaa4;font-weight:700}.tag{padding:4px 7px;border-radius:20px;background:#2c3042;color:#c2b1ff;font-size:9px;text-transform:capitalize}.expense{background:#3a282b;color:#f2a7a1}.income{background:#19372f;color:#72ddb4}.investment{background:#2c2746;color:#c0aaff}.saving{background:#1c3840;color:#7ed9e7}.toolbar{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}.field{background:#0b1421;border:1px solid #2a394e;border-radius:8px;padding:10px;color:#dce6f3;font-size:11px;outline:0}.toolbar input{flex:1;min-width:160px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:17px}.card h3{font:700 13px Manrope}.big{font:700 20px Manrope;margin:14px 0}.big small{font:400 10px 'DM Sans';color:#8291a6}.foot{display:flex;justify-content:space-between;font-size:9px;color:#8796aa;margin-top:8px}.empty{text-align:center;padding:25px;color:#8796aa;font-size:11px;line-height:1.6}.modalbg{position:fixed;inset:0;background:#020711d0;backdrop-filter:blur(6px);z-index:8;display:grid;place-items:center;padding:15px}.modal{width:min(550px,100%);max-height:92vh;overflow:auto;background:#111c2b;border:1px solid #30415a;border-radius:15px;padding:21px}.modal h2{font:800 19px Manrope}.form{display:grid;gap:11px}.form label{display:grid;gap:5px;color:#aab9cc;font-size:10px}.form input,.form select,.form textarea{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.types{display:flex;gap:4px;flex-wrap:wrap}.types button{flex:1;background:#0b1421;border:1px solid #26364b;color:#8fa0b7;padding:8px;border-radius:7px;font-size:10px}.types button.sel{background:#24446c;color:#c5e0ff}.actions{display:flex;justify-content:end;gap:8px;margin-top:5px}.auth{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 50% 15%,#1b3560,transparent 48%),#080d18}.authbox{width:min(420px,100%);padding:27px;background:#101a29;border:1px solid #28384f;border-radius:17px}.authbox h1{font:800 24px Manrope}.authbox p{font-size:11px;color:#8b9ab0;line-height:1.6}.authbox form{display:grid;gap:12px}.authbox label{display:grid;gap:6px;color:#a9b8ca;font-size:10px}.error{color:#ffb7b7;background:#3b2228;padding:9px;border-radius:8px;font-size:10px}.setup{max-width:550px;margin:9vh auto;padding:28px;background:#101a29;border:1px solid #2a3b53;border-radius:18px}.setup h1{font:800 25px Manrope}.setup p,.setup li{font-size:11px;color:#91a0b5;line-height:1.7}.hide{display:none!important}.hamb{display:none}@media(max-width:1000px){.content{padding:25px 22px}.top{padding:0 22px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:750px){.side{transform:translateX(-105%);transition:.2s;z-index:7;box-shadow:20px 0 50px #0008}.side.open{transform:translateX(0)}.main{margin:0}.hamb{display:inline-block}.top{height:65px;padding:0 13px}.content{padding:22px 13px 40px}.hero,.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.head h1{font-size:22px}}@media(max-width:480px){.metrics{gap:7px}.metric{padding:11px}.metric b{font-size:16px}.metric small{font-size:9px}.amount{font-size:31px}.row{gap:22px}.cards,.two{grid-template-columns:1fr}.head{gap:8px}.head h1{font-size:20px}.head>.btn{font-size:0}.head>.btn:after{content:'+';font-size:16px}.modal{padding:15px}}
</style></head><body><div id="root"></div><script>
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(+n||0),month=()=>new Date().toISOString().slice(0,7),today=()=>new Date().toISOString().slice(0,10),cats={expense:['Housing','Food & groceries','Transport','Shopping','Health','Entertainment','Education','Bills & utilities','Subscriptions','Travel','Family','Personal care','Other'],income:['Salary','Freelance','Business','Interest','Refund','Gift','Other income'],investment:['Mutual funds','Stocks','ETF','Gold','Fixed deposit','PPF / EPF','Crypto','Other investment'],saving:['Emergency fund','Savings account','Travel fund','Major purchase','Other savings'],transfer:['Own-account transfer','Wallet transfer','Other transfer']};let cfg=JSON.parse(sessionStorage.getItem('sm_cfg')||'null'),token=sessionStorage.getItem('sm_token'),email=sessionStorage.getItem('sm_email'),data={tx:[],budgets:[],goals:[]},tab='Overview';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function req(path,method='GET',body){let r=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/'+path,{method,headers:{apikey:cfg.key,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=representation'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error((await r.text()).slice(0,250));return r.status===204?null:r.json()}
async function auth(path,body){let r=await fetch(cfg.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||'Authentication failed');return d}
function setup(){document.body.innerHTML='<main class="setup"><div class="logo">◈</div><div class="eyebrow">SMARTMONEY OS · INITIAL SETUP</div><h1>Connect your private finance workspace.</h1><p>Create a Supabase project, run the included SQL migration, then enter the project URL and publishable/anon key. The key is public by design; database Row Level Security protects each account.</p><ol><li>Create a project at Supabase.</li><li>Run <code>supabase/migrations/0001_initial_schema.sql</code> in SQL Editor.</li><li>Paste your Project URL and publishable/anon key below.</li></ol><form class="form" id="cfg"><label>Project URL<input class="field" name="url" required placeholder="https://project.supabase.co"></label><label>Publishable / anon key<textarea class="field" name="key" rows="3" required></textarea></label><button class="btn primary">Connect →</button></form><p>Never enter a service-role key, bank password, UPI PIN, OTP or card CVV.</p></main>';$('#cfg').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),url=String(f.get('url')).trim().replace(/\/$/,'');if(!/^https:\/\/[\w-]+\.supabase\.co$/i.test(url))return alert('Enter a valid Supabase project URL');cfg={url,key:String(f.get('key')).trim()};sessionStorage.setItem('sm_cfg',JSON.stringify(cfg));render()}}
function login(){document.body.innerHTML='<div class="auth"><div class="authbox"><div class="brand"><div class="logo">◈</div><div><b>SmartMoney <em>OS</em></b><small>PRIVATE FINANCE WORKSPACE</small></div></div><div class="eyebrow">YOUR MONEY, IN FOCUS</div><h1 id="title">Welcome back.</h1><p>Sign in to access your private financial command center.</p><form id="login"><label>Email<input class="field" type="email" name="email" required></label><label>Password<input class="field" type="password" name="password" minlength="8" required></label><div id="err"></div><button class="btn primary">Sign in securely →</button></form><p><button class="danger" id="switch">Create account</button> · <button class="danger" onclick="resetCfg()">Change project</button></p></div></div>';let mode='login';$('#switch').onclick=()=>{mode=mode==='login'?'signup':'login';$('#title').textContent=mode==='login'?'Welcome back.':'Create your secure account.';$('#switch').textContent=mode==='login'?'Create account':'Sign in'};$('#login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let d=await auth(mode==='login'?'token?grant_type=password':'signup',{email:f.get('email'),password:f.get('password')});if(!d.access_token){$('#err').innerHTML='<div class="error">Check your email to confirm your account, then sign in.</div>';return}token=d.access_token;email=d.user.email;sessionStorage.setItem('sm_token',token);sessionStorage.setItem('sm_email',email);render();load()}catch(x){$('#err').innerHTML='<div class="error">'+esc(x.message)+'</div>'}}}
function resetCfg(){sessionStorage.clear();cfg=null;token=null;render()}function logout(){sessionStorage.removeItem('sm_token');token=null;render()}
async function load(){try{let [tx,b,g]=await Promise.all([req('transactions?select=*&order=occurred_on.desc&limit=500'),req('budgets?select=*&month=eq.'+month()),req('savings_goals?select=*&order=created_at.desc')]);data={tx:tx||[],budgets:b||[],goals:g||[]};page()}catch(e){alert('Database setup error: '+e.message)}}
function total(type,rows=data.tx.filter(x=>x.occurred_on?.startsWith(month()))){return rows.filter(x=>x.type===type).reduce((s,x)=>s+ +x.amount,0)}
function render(){if(!cfg?.url||!cfg?.key){setup();return}if(!token){login();return}document.body.innerHTML='<div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">◈</div><div><b>SmartMoney <em>OS</em></b><small>FINANCE COMMAND CENTER</small></div></div><div class="eyebrow" style="padding:0 12px 12px">WORKSPACE</div><nav class="nav">'+['Overview','Transactions','Budgets','Savings goals','Settings'].map(x=>'<button class="'+(tab===x?'on':'')+'" onclick="go(\''+x+'\')">'+({Overview:'◫',Transactions:'▤',Budgets:'▥','Savings goals':'◎',Settings:'⚙'}[x])+' &nbsp; '+x+'</button>').join('')+'</nav><div class="bottom"><div class="privacy">◉ &nbsp; <b>Private by design</b><br>Per-user database access policies.</div><div class="user">'+esc(email)+'<br><button class="danger" onclick="logout()">Sign out ↗</button></div></div></aside><main class="main"><header class="top"><div><button class="btn ghost hamb" onclick="$(\'#side\').classList.toggle(\'open\')">☰</button><div class="crumb">Workspace / '+tab+'</div><div class="date">'+new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'</div></div><button class="btn primary" onclick="addTx()">＋ Add transaction</button></header><div class="content" id="page"></div></main></div><div id="modal"></div>';page()}
function go(t){tab=t;render();page()}
function table(rows){if(!rows.length)return '<div class="empty">No transactions yet. Add your first transaction to get started.</div>';return '<div style="overflow:auto"><table><thead><tr><th>TRANSACTION</th><th>PLATFORM / PURPOSE</th><th>DATE</th><th>TYPE</th><th class="right">AMOUNT</th><th></th></tr></thead><tbody>'+rows.map(x=>'<tr><td><div class="name">'+esc(x.title)+'</div><div class="sub">'+esc(x.category)+' · '+esc(x.payment_method||'Payment')+'</div></td><td><div class="name">'+esc(x.platform||'—')+'</div><div class="sub">'+esc(x.purpose||x.account_name||'No purpose added')+'</div></td><td>'+x.occurred_on+'</td><td><span class="tag '+x.type+'">'+x.type+'</span></td><td class="right '+(x.type==='income'?'pos':'neg')+'">'+(x.type==='income'?'+':'−')+money(x.amount)+'</td><td><button class="danger" onclick="delTx(\''+x.id+'\')">⌫</button></td></tr>').join('')+'</tbody></table></div>'}
function page(){let p=$('#page');if(!p)return;let inc=total('income'),exp=total('expense'),inv=total('investment'),sav=total('saving'),net=inc-exp-inv-sav,bt=data.budgets.reduce((s,x)=>s+ +x.monthly_limit,0),heading=(h,d,btn='')=>'<div class="head"><div><div class="eyebrow">PERSONAL FINANCE / '+month()+'</div><h1>'+h+'</h1><p>'+d+'</p></div>'+btn+'</div>';let html='';if(tab==='Overview'){let c={};data.tx.filter(x=>x.type==='expense'&&x.occurred_on.startsWith(month())).forEach(x=>c[x.category]=(c[x.category]||0)+ +x.amount);let top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=Math.max(1,...top.map(x=>x[1]));html=heading('Your financial overview','A clearer picture of what came in, went out and what you are building.')+'<div class="hero"><div class="balance"><div class="label">MONTHLY NET POSITION · LIVE</div><div class="amount">'+money(net)+'</div><div class="hint">Income less expenses, investments and savings this month</div><div class="row"><div><small>Income</small><b style="color:#a7f0d0">↙ '+money(inc)+'</b></div><div><small>Outflows & allocations</small><b style="color:#ffd0c9">↗ '+money(exp+inv+sav)+'</b></div></div></div><div class="insight"><div class="eyebrow">✧ SMART SAVINGS INSIGHT</div><h3>'+(inc===0?'Start with your income.':net>0?'You have money left to assign.':'Your outflows exceed income.')+'</h3><p>'+(inc===0?'Record salary or other income to unlock savings insights.':net>0?'You have '+money(net)+' unallocated this month. Consider assigning part to your emergency fund after upcoming bills.':'Review discretionary spending and upcoming commitments. Keep investments separate from expenses.')+'</p><button class="btn ghost" onclick="go(\'Budgets\')">Review my plan →</button></div></div><div class="metrics">'+[['Expenses',money(exp),'This month'],['Investments',money(inv),'Capital allocated'],['Savings',money(sav),'Contributions'],['Budget remaining',bt?money(Math.max(0,bt-exp)):'—',bt?'Of monthly limits':'No budgets set']].map(x=>'<div class="metric"><small>'+x[0]+'</small><b>'+x[1]+'</b><em>'+x[2]+'</em></div>').join('')+'</div><div class="grid"><section class="panel"><h2>Spending breakdown</h2><div class="muted">Top expense categories this month</div>'+(top.length?top.map(x=>'<div class="cat"><div class="catline"><span>'+esc(x[0])+'</span><b>'+money(x[1])+'</b></div><div class="track"><div class="fill" style="width:'+x[1]/mx*100+'%"></div></div></div>').join(''):'<div class="empty">Add expenses to see your spending breakdown.</div>')+'</section><section class="panel"><h2>Money allocation</h2><div class="muted">How this month’s income is assigned</div>'+(inc?'<div class="amount" style="font-size:24px">'+money(inc)+'</div><div class="stack"><i style="width:'+exp/inc*100+'%"></i><i style="width:'+inv/inc*100+'%"></i><i style="width:'+sav/inc*100+'%"></i></div><div class="legend"><div><i class="dot"></i>Expenses <b>'+money(exp)+'</b></div><div><i class="dot purple"></i>Investments <b>'+money(inv)+'</b></div><div><i class="dot green"></i>Savings <b>'+money(sav)+'</b></div><div><i class="dot gray"></i>Unallocated <b>'+money(Math.max(0,net))+'</b></div></div>':'<div class="empty">Add income to see your allocation.</div>')+'</section></div><section class="panel"><h2>Recent activity</h2><div class="muted" style="margin-bottom:15px">Latest transactions</div>'+table(data.tx.slice(0,5))+'</section>'}
if(tab==='Transactions')html=heading('Transactions','Every payment, platform and purpose — in one searchable ledger.','<button class="btn primary" onclick="addTx()">＋ Add</button>')+'<section class="panel"><div class="toolbar"><input class="field" id="q" placeholder="Search platform, category or purpose…"><select class="field" id="filter"><option value="all">All types</option>'+['expense','income','investment','saving','transfer'].map(x=>'<option>'+x+'</option>').join('')+'</select><button class="btn ghost" onclick="csv()">↓ Export CSV</button></div><div id="table">'+table(data.tx)+'</div></section>';
if(tab==='Budgets')html=heading('Monthly budgets','Set category limits and keep spending intentional.','<button class="btn primary" onclick="addBudget()">＋ Create budget</button>')+'<div class="cards">'+(data.budgets.length?data.budgets.map(b=>{let spent=total('expense',data.tx.filter(x=>x.occurred_on.startsWith(month())&&x.category===b.category)),pct=Math.min(100,spent/b.monthly_limit*100);return '<section class="panel card"><h3>'+esc(b.category)+'</h3><div class="big">'+money(spent)+' <small>/ '+money(b.monthly_limit)+'</small></div><div class="track"><div class="fill" style="width:'+pct+'%;background:'+(pct>90?'#e87878':'')+'"></div></div><div class="foot"><span>'+Math.round(pct)+'% used</span><b>'+money(Math.max(0,b.monthly_limit-spent))+' left</b></div></section>'}).join(''):'<section class="panel empty">No budgets yet. Create your first category limit.<br><button class="btn primary" onclick="addBudget()">Create budget</button></section>')+'</div>';
if(tab==='Savings goals')html=heading('Savings goals','Turn milestones into measurable plans.','<button class="btn primary" onclick="addGoal()">＋ New goal</button>')+'<div class="cards">'+(data.goals.length?data.goals.map(g=>{let pct=Math.min(100,g.current_amount/g.target_amount*100);return '<section class="panel card"><h3>◎ '+esc(g.name)+'</h3><div class="big">'+money(g.current_amount)+' <small>of '+money(g.target_amount)+'</small></div><div class="track"><div class="fill" style="width:'+pct+'%;background:#a58cf8"></div></div><div class="foot"><span>'+Math.round(pct)+'% complete</span><b>'+money(Math.max(0,g.target_amount-g.current_amount))+' to go</b></div>'+(g.target_date?'<div class="muted">Target '+g.target_date+'</div>':'')+'<button class="danger" onclick="delGoal(\''+g.id+'\')">Delete goal</button></section>'}).join(''):'<section class="panel empty">Create an emergency fund or a goal for a planned purchase.<br><button class="btn primary" onclick="addGoal()">Create savings goal</button></section>')+'</div>';
if(tab==='Settings')html=heading('Settings','Manage your workspace and data preferences.')+'<div class="grid"><section class="panel"><h2>Account & security</h2><p class="muted">'+esc(email)+'</p><p class="muted">Supabase Auth and Row Level Security protect your records.</p><button class="btn ghost" onclick="logout()">Sign out</button></section><section class="panel"><h2>Currency & privacy</h2><p class="muted">Indian Rupee (INR). Manual transaction tracking. No bank passwords, UPI PINs, OTPs or card CVVs are collected.</p><button class="btn ghost" onclick="csv()">Export CSV</button></section></div>';p.innerHTML=html;if(tab==='Transactions'){let q=$('#q'),f=$('#filter');q.oninput=f.onchange=()=>$('#table').innerHTML=table(data.tx.filter(x=>(f.value==='all'||x.type===f.value)&&JSON.stringify(x).toLowerCase().includes(q.value.toLowerCase())))}}
function modal(title,body){$('#modal').innerHTML='<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="eyebrow">SMARTMONEY OS</div><h2>'+title+'</h2>'+body+'</div></div>'}function closeModal(){$('#modal').innerHTML=''}
function addTx(){let type='expense';modal('Record a transaction','<form class="form" id="tx"><div class="types">'+Object.keys(cats).map(t=>'<button type="button" class="'+(t===type?'sel':'')+'" data-t="'+t+'">'+t+'</button>').join('')+'</div><label>Amount (₹)<input class="field" name="amount" type="number" min=".01" step=".01" required></label><label>Description<input class="field" name="title" maxlength="100" required placeholder="e.g. Monthly SIP payment"></label><div class="two"><label>Category<select class="field" name="category">'+cats[type].map(c=>'<option>'+c+'</option>').join('')+'</select></label><label>Platform / merchant<input class="field" name="platform" placeholder="Groww, Amazon, Swiggy"></label></div><label>Purpose / why are you paying?<input class="field" name="purpose" placeholder="Monthly investment, groceries…"></label><div class="two"><label>Payment method<select class="field" name="payment_method">'+['UPI','Debit card','Credit card','Net banking','Cash','Bank transfer','Wallet','Other'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><label>Account / wallet<input class="field" name="account_name" value="Primary bank"></label></div><div class="two"><label>Date<input class="field" name="occurred_on" type="date" value="'+today()+'" required></label><label>Recurring<select class="field" name="recurring"><option value="false">No</option><option value="true">Yes</option></select></label></div><label>Notes<textarea class="field" name="notes" rows="2" maxlength="500"></textarea></label><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary">Save transaction →</button></div></form>');$('#tx').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{type=b.dataset.t;$('#tx').querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('sel',x===b));$('#tx [name=category]').innerHTML=cats[type].map(c=>'<option>'+c+'</option>').join('')});$('#tx').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),row={title:f.get('title'),amount:+f.get('amount'),type,category:f.get('category'),platform:f.get('platform')||null,purpose:f.get('purpose')||null,payment_method:f.get('payment_method'),account_name:f.get('account_name')||null,occurred_on:f.get('occurred_on'),recurring:f.get('recurring')==='true',notes:f.get('notes')||null};if(row.amount<=0)return alert('Enter an amount greater than zero.');try{let r=await req('transactions','POST',row);data.tx.unshift(r[0]);closeModal();page()}catch(x){alert(x.message)}}}
function addBudget(){modal('Set a monthly budget','<form class="form" id="budget"><label>Expense category<select class="field" name="category">'+cats.expense.map(x=>'<option>'+x+'</option>').join('')+'</select></label><label>Monthly limit (₹)<input class="field" name="monthly_limit" type="number" min="1" value="5000" required></label><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary">Save budget</button></div></form>');$('#budget').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let r=await req('budgets?on_conflict=user_id,category,month','POST',{category:f.get('category'),monthly_limit:+f.get('monthly_limit'),month:month()});data.budgets=data.budgets.filter(x=>x.category!==r[0].category);data.budgets.push(r[0]);closeModal();page()}catch(x){alert(x.message)}}}
function addGoal(){modal('Create a savings goal','<form class="form" id="goal"><label>Goal name<input class="field" name="name" required value="Emergency fund"></label><div class="two"><label>Target amount (₹)<input class="field" name="target_amount" type="number" min="1" value="50000" required></label><label>Already saved (₹)<input class="field" name="current_amount" type="number" min="0" value="0"></label></div><label>Target date<input class="field" name="target_date" type="date"></label><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary">Create goal</button></div></form>');$('#goal').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let r=await req('savings_goals','POST',{name:f.get('name'),target_amount:+f.get('target_amount'),current_amount:+f.get('current_amount'),target_date:f.get('target_date')||null});data.goals.unshift(r[0]);closeModal();page()}catch(x){alert(x.message)}}}
async function delTx(id){if(!confirm('Delete this transaction?'))return;try{await req('transactions?id=eq.'+id,'DELETE');data.tx=data.tx.filter(x=>x.id!==id);page()}catch(x){alert(x.message)}}async function delGoal(id){if(!confirm('Delete this goal?'))return;try{await req('savings_goals?id=eq.'+id,'DELETE');data.goals=data.goals.filter(x=>x.id!==id);page()}catch(x){alert(x.message)}}
function csv(){let rows=[['Date','Description','Type','Category','Platform','Purpose','Payment method','Account','Amount'],...data.tx.map(x=>[x.occurred_on,x.title,x.type,x.category,x.platform||'',x.purpose||'',x.payment_method||'',x.account_name||'',x.amount])],s=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.href=u;a.download='smartmoney-transactions-'+month()+'.csv';a.click();URL.revokeObjectURL(u)}
render();if(token)load();
</script></body></html>
